<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-CORE // ULTRA NEON PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="scanlines relative flex flex-col justify-between w-screen h-screen">

    <canvas id="main-canvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

    <header class="relative z-10 w-full p-2 md:p-3 pointer-events-none">
        <div class="max-w-6xl mx-auto flex justify-between items-center glass-panel px-4 py-2 pointer-events-auto">
            
            <div class="flex items-center gap-2.5">
                <div class="relative flex items-center justify-center w-3 h-3">
                    <span class="w-full h-full rounded-full bg-cyan-400 animate-ping absolute opacity-75"></span>
                    <span class="w-2 h-2 rounded-full bg-cyan-400 relative shadow-[0_0_8px_#00f3ff]"></span>
                </div>
                <h1 class="font-orbitron font-extrabold text-sm md:text-base tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500">
                    CYBER-CORE <span class="text-[10px] font-semibold text-cyan-300/80 font-sans tracking-normal ml-1">v4.0 PRO</span>
                </h1>
            </div>

            <div class="hidden sm:flex items-center mx-4 flex-1 max-w-xl overflow-hidden">
                <div class="w-full text-center">
                    <p id="speech-subtitles" class="text-xs text-cyan-300 font-mono italic tracking-wide truncate">
                        <i class="fa-solid fa-terminal text-fuchsia-400 mr-1.5"></i>Sistemas en espera. Selecciona un comando o estado de ánimo.
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-3 text-[11px] font-mono">
                <div class="hidden md:flex flex-col text-right">
                    <span class="text-slate-400 text-[9px]">ESTADO</span>
                    <span id="hud-mood" class="text-fuchsia-400 font-bold tracking-wider uppercase">CYBERPUNK</span>
                </div>
                <div class="bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 px-2.5 py-1 rounded-lg font-bold font-orbitron shadow-[0_0_8px_rgba(0,243,255,0.2)]" id="hud-fps">
                    60 FPS
                </div>
            </div>

        </div>
    </header>

    <div class="sm:hidden relative z-10 w-full px-3 pointer-events-none -mt-1">
        <div class="glass-panel p-2 rounded-lg text-center">
            <p id="speech-subtitles-mobile" class="text-[11px] text-cyan-300 font-mono italic truncate">
                <i class="fa-solid fa-terminal text-fuchsia-400 mr-1"></i>Sistemas inicializados.
            </p>
        </div>
    </div>

    <main class="relative z-10 w-full max-w-7xl mx-auto p-3 md:p-5 flex flex-col md:flex-row justify-between items-end gap-3 pointer-events-none mb-1">
        
        <div class="w-full md:w-72 glass-panel p-3 rounded-xl pointer-events-auto flex flex-col gap-2.5">
            <div class="flex items-center justify-between border-b border-cyan-500/20 pb-1.5">
                <h2 class="font-orbitron text-[11px] font-bold text-cyan-400 tracking-wider uppercase flex items-center gap-1.5">
                    <i class="fa-solid fa-terminal text-fuchsia-400"></i> Protocolos de Voz
                </h2>
                <span class="w-2 h-2 rounded-full bg-fuchsia-500 shadow-[0_0_8px_#ff007f]"></span>
            </div>

            <div class="grid grid-cols-2 gap-1.5 text-xs font-semibold">
                <button onclick="app.speakPreset('saludo')" class="btn-cyber p-2 rounded-lg text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-hand-wave text-cyan-400"></i> Saludar
                </button>
                <button onclick="app.speakPreset('estado')" class="btn-cyber p-2 rounded-lg text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-microchip text-fuchsia-400"></i> Estado
                </button>
                <button onclick="app.speakPreset('chiste')" class="btn-cyber p-2 rounded-lg text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-face-laugh-beam text-cyan-400"></i> Bromear
                </button>
                <button onclick="app.speakPreset('mision')" class="btn-cyber p-2 rounded-lg text-left flex items-center gap-1.5">
                    <i class="fa-solid fa-crosshairs text-fuchsia-400"></i> Objetivo
                </button>
            </div>
        </div>

        <div class="w-full md:w-96 glass-panel p-3.5 rounded-xl pointer-events-auto flex flex-col gap-2.5">
            
            <div>
                <h2 class="font-orbitron text-[11px] font-bold text-fuchsia-400 tracking-wider uppercase mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-masks-theater text-cyan-400"></i> Estado de Ánimo
                </h2>
                <div class="grid grid-cols-4 gap-1.5 text-[11px] font-bold font-orbitron">
                    <button onclick="app.setMood('cyberpunk')" class="bg-cyan-950/60 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-300 p-1.5 rounded-lg flex flex-col items-center gap-1 transition shadow-[0_0_8px_rgba(0,243,255,0.15)]">
                        <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-cyan-400 to-fuchsia-500"></span> Cyber
                    </button>
                    <button onclick="app.setMood('zen')" class="bg-indigo-950/60 hover:bg-indigo-900/80 border border-indigo-500/40 text-indigo-300 p-1.5 rounded-lg flex flex-col items-center gap-1 transition shadow-[0_0_8px_rgba(99,102,241,0.15)]">
                        <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-indigo-400 to-violet-400"></span> Zen
                    </button>
                    <button onclick="app.setMood('surprised')" class="bg-amber-950/60 hover:bg-amber-900/80 border border-amber-500/40 text-amber-300 p-1.5 rounded-lg flex flex-col items-center gap-1 transition shadow-[0_0_8px_rgba(245,158,11,0.15)]">
                        <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-amber-400 to-orange-400"></span> Alerta
                    </button>
                    <button onclick="app.setMood('berserk')" class="bg-rose-950/60 hover:bg-rose-900/80 border border-rose-500/40 text-rose-300 p-1.5 rounded-lg flex flex-col items-center gap-1 transition shadow-[0_0_8px_rgba(244,63,94,0.15)]">
                        <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-rose-600 to-red-500"></span> Furia
                    </button>
                </div>
            </div>

            <div class="relative">
                <input type="text" id="custom-text-input" placeholder="Escribe un comando personalizado..." 
                       class="w-full cyber-input px-3 py-2 rounded-lg text-xs font-mono pr-9">
                <button onclick="app.speakCustomText()" class="absolute right-1 top-1 bg-gradient-to-r from-cyan-500 to-fuchsia-500 hover:from-cyan-400 hover:to-fuchsia-400 text-slate-950 p-1 rounded-md transition font-bold text-xs w-6 h-6 flex items-center justify-center shadow-[0_0_8px_rgba(0,243,255,0.4)]">
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 font-mono">
                <div>
                    <label class="block mb-0.5">TONO: <span id="val-pitch" class="text-cyan-400">0.9</span></label>
                    <input type="range" id="slider-pitch" min="0.5" max="1.5" step="0.1" value="0.9" oninput="document.getElementById('val-pitch').innerText=this.value" class="w-full accent-cyan-400 bg-slate-800 rounded-lg cursor-pointer h-1">
                </div>
                <div>
                    <label class="block mb-0.5">VELOCIDAD: <span id="val-rate" class="text-fuchsia-400">1.0</span></label>
                    <input type="range" id="slider-rate" min="0.7" max="1.4" step="0.1" value="1.0" oninput="document.getElementById('val-rate').innerText=this.value" class="w-full accent-fuchsia-400 bg-slate-800 rounded-lg cursor-pointer h-1">
                </div>
            </div>

        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
